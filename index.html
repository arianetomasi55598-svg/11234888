<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código do Produto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .label {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .code {
      font-size: 36px;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Código do Produto</p>
    <p class="code">https://11234888</p>
  </div>
</body>
</html>
